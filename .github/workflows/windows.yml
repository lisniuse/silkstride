name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build native x64 executable
        run: ./build.ps1
      - name: Run non-destructive diagnostics
        run: ./test.ps1
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Silkstride-windows-x64
          path: |
            build/Silkstride.exe
            out/tests/*-test.txt
            out/tests/i18n-*.png
